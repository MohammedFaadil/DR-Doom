# Render Blueprint — see DEPLOY_RENDER.md for the full manual walkthrough.
# `render.yaml` lets you deploy everything (Postgres + backend + frontend)
# in one "New Blueprint Instance" action from the Render dashboard.
#
# NOTE (§25): Render's free Postgres plan has a limited retention/lifespan.
# This is a demo/prototype deployment target, not permanent medical-record
# storage — see README.md "Render Free storage constraint".

databases:
  - name: drdoom-db
    databaseName: drdoom
    user: drdoom
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: drdoom-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drdoom-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: MODEL_PROVIDER
        value: template
      - key: MODEL_NAME
        value: Qwen/Qwen2.5-0.5B-Instruct
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: VECTOR_INDEX_PATH
        value: knowledge_base/index
      - key: KNOWLEDGE_VERSION
        value: "2026.08.1"
      - key: HYBRID_SEMANTIC_WEIGHT
        value: "0.70"
      - key: HYBRID_KEYWORD_WEIGHT
        value: "0.30"
      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: GROUNDING_MIN_SIMILARITY
        value: "0.42"
      - key: ENABLE_VOICE
        value: "true"
      - key: ENABLE_TTS
        value: "true"
      - key: ENABLE_SERVER_TRANSCRIBE
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://drdoom-frontend.onrender.com
      - key: RATE_LIMIT_CHAT
        value: 30/minute
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_VOICE
        value: 15/minute

  - type: web
    name: drdoom-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://drdoom-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
