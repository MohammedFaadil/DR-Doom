# Render Blueprint — see DEPLOY_RENDER.md for the full manual walkthrough.
# `render.yaml` lets you deploy everything this app needs — Postgres
# database (users/auth, conversations, everything), backend API, frontend —
# in one "New Blueprint Instance" action from the Render dashboard. You'll
# be prompted once for GROQ_API_KEY (get a free one at
# https://console.groq.com/keys); every other value below is either
# generated or already filled in.
#
# Because the AI provider (Groq) runs on Groq's own infrastructure rather
# than in this app's container, the whole stack — including real LLM-
# powered answers, not just the deterministic fallback — runs on Render's
# FREE plan for both services. No paid plan required for full
# functionality.
#
# NOTE (§25): Render's free Postgres plan has a limited retention/lifespan.
# This is a demo/prototype deployment target, not permanent medical-record
# storage — see README.md "Render Free storage constraint".

databases:
  - name: drdoom-db
    databaseName: drdoom
    user: drdoom
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: drdoom-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drdoom-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # groq = Groq-hosted Llama 3.3 70B via their OpenAI-compatible API —
      # the production default. Runs on Groq's infrastructure, so it has
      # zero local RAM cost regardless of Render plan (see
      # app/core/model_registry.py::GroqProvider). Needs GROQ_API_KEY,
      # entered below as a Render dashboard secret — get a free key at
      # https://console.groq.com/keys. If it's ever unset or Groq is
      # unreachable, ModelManager automatically falls back to `template`
      # (deterministic, zero dependencies) rather than erroring.
      - key: MODEL_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # secret — set manually in the Render dashboard, never committed here
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MODEL_MAX_TOKENS
        value: "900"
      - key: MODEL_TEMPERATURE
        value: "0.2"
      - key: CONVERSATION_HISTORY_TURNS
        value: "8"
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: VECTOR_INDEX_PATH
        value: knowledge_base/index
      - key: KNOWLEDGE_VERSION
        value: "2026.08.1"
      - key: HYBRID_SEMANTIC_WEIGHT
        value: "0.65"
      - key: HYBRID_KEYWORD_WEIGHT
        value: "0.35"
      - key: RETRIEVAL_TOP_K
        value: "8"
      - key: GROUNDING_MIN_SIMILARITY
        value: "0.42"
      - key: ENABLE_VOICE
        value: "true"
      - key: ENABLE_TTS
        value: "true"
      - key: ENABLE_SERVER_TRANSCRIBE
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://drdoom-frontend.onrender.com
      - key: RATE_LIMIT_CHAT
        value: 30/minute
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_VOICE
        value: 15/minute

  - type: static
    name: drdoom-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://drdoom-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
